# Render blueprint — deploys the FastAPI backend as a free web service with a
# managed PostgreSQL database.
#
# The Next.js frontend is deployed SEPARATELY on Vercel (see
# frontend/vercel.json). For the two to talk:
#   * Vercel  → NEXT_PUBLIC_API_URL must point at THIS service's URL.
#   * Here    → CORS_ORIGINS must list the Vercel frontend URL (replace the
#               placeholder below with your real https://*.vercel.app domain).
#
# Deploy: push this repo to GitHub, then in Render click "New" → "Blueprint" and
# select the repo. Render reads this file and creates both resources.
#
# Full walkthrough, variable reference and troubleshooting: RENDER_DEPLOYMENT.md

databases:
  - name: thermal-shelter-db
    databaseName: thermal_shelter
    user: shelter_user
    plan: free
    postgresMajorVersion: "16"
    region: singapore

services:
  - type: web
    name: thermal-shelter-api
    runtime: python
    # The FastAPI service lives in the backend/ directory.
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Injected automatically from the database created above — no secrets to copy.
      - key: DATABASE_URL
        fromDatabase:
          name: thermal-shelter-db
          property: connectionString
      # Replace the placeholder with your real Vercel frontend URL (both the
      # production and preview domains if you use preview deploys).
      - key: CORS_ORIGINS
        value: "https://your-frontend.vercel.app,http://localhost:3000"
      - key: ENABLE_LIVE_CLIMATE
        value: "true"
      - key: OPEN_METEO_TIMEOUT_S
        value: "20.0"
      # Python version (also pinned via backend/runtime.txt).
      - key: PYTHON_VERSION
        value: "3.11"
