# Render Blueprint for SIH Thermal Shelter System
# This file automates the deployment of backend and database on Render

services:
  # Backend API Service
  - type: web
    name: sih-thermal-shelter-api
    runtime: python
    plan: free  # Change to 'starter' or higher for production
    region: oregon  # Choose closest region: oregon, frankfurt, singapore
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_NAME
        value: SIH Thermal Shelter Design System
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: '["https://your-frontend.vercel.app","http://localhost:3000"]'
      - key: OPENMETEO_API_URL
        value: https://api.open-meteo.com/v1
      - key: OPEN_METEO_BASE
        value: https://archive-api.open-meteo.com/v1/archive
      - key: ENABLE_LIVE_CLIMATE
        value: true
      - key: USE_ML_OPTIMIZATION
        value: False
      - key: ENABLE_ML_FEATURES
        value: True
      - key: ENABLE_ADVANCED_THERMAL_MODEL
        value: True
      - key: ENABLE_COST_OPTIMIZATION
        value: True
      - key: ENABLE_ENERGY_SIMULATION
        value: True
      - key: DATABASE_URL
        fromDatabase:
          name: sih-thermal-shelter-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
        
    healthCheckPath: /api/health
    
    autoDeploy: true
    
databases:
  # PostgreSQL Database
  - name: sih-thermal-shelter-db
    plan: free  # Change to 'starter' or higher for production
    databaseName: thermal_shelter
    user: thermal_shelter_user
    region: oregon  # Should match service region
